name: CLI Release

# Builds the standalone `olenro` CLI/TUI binary for every platform and uploads
# the archives to a GitHub Release. Triggered by pushing a `cli-v*` tag, e.g.:
#
#   git tag cli-v2.0.0 && git push origin cli-v2.0.0
#
# The desktop app uses `v*` tags (release.yml); `cli-v*` keeps the two separate.
# The CLI only depends on `olenro-core` (no Tauri / Node / WebKit), so each job
# is just `cargo build --bin olenro` and finishes in a few minutes.

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      # rusqlite is built with the `bundled` feature (compiles SQLite from C),
      # so cross-compiling to aarch64 Linux needs that target's C toolchain.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 Linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: olenro
          target: ${{ matrix.target }}
          # Produces e.g. olenro-aarch64-apple-darwin.tar.gz (zip on Windows).
          archive: olenro-$target
          tar: unix
          zip: windows
          checksum: sha256
          include: LICENSE,README.md
          token: ${{ secrets.GITHUB_TOKEN }}
