[package]
name = "olenro-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Core library for Olenro - Agent Workspace for AI Coding Tools"

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
# Workspace shared
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
dirs.workspace = true

# HTTP proxy (axum-based)
axum = "0.7"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace"] }
http-body-util = "0.1"
rustls = "0.23"
rustls-native-certs = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }

# Async runtime
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"

# Serialization
toml = "0.8"
toml_edit = "0.22"
serde_yaml = "0.9"
json5 = "1.3"
json-five = "0.3.1"
indexmap = { version = "2", features = ["serde"] }

# Async trait
async-trait = "0.1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# URL parsing
url = "2.5"

# Regex (skills.sh popular-list HTML scraping)
regex = "1"

# Error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
time = { version = "0.3", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Compression
flate2 = "1"
brotli = "7"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
